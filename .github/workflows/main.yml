name: Sync with Upstream
on:
  schedule:
    - cron: "0 0 * * *"  # 每天 0 点自动同步
  workflow_dispatch:

# ✨ 修复 1：显式授予写入权限，解决 exit code 128 错误
permissions:
  contents: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      # ✨ 修复 2：升级到 v4，消除 Node 20 弃用警告
      - name: Checkout target repo
        uses: actions/checkout@v4

      # ✨ 修复 3：升级到 v3.9（或更高版本），完美支持 Node 24
      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: JustVugg/colibri
          target_sync_branch: main # 💡 提示：确保这里填入的是你本地需要同步的分支名（如 main 或 master）
          upstream_sync_branch: main # 💡 提示：确保这里填入的是上游仓库的分支名
