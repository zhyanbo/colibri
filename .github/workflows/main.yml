name: Sync with Upstream
on:
  schedule:
    - cron: "0 0 * * *"  # 每天 0 点自动同步
  workflow_dispatch:

permissions:
  contents: write
  actions: write         # 建议同时保留此声明

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7

      - name: Sync Upstream
        # 💡 建议按你的注释所说，升级到 v3.9+ 获得更好的新环境支持
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.9
        with:
          # ✨ 修复核心：使用刚刚配置的具有 workflow 权限的自定义 PAT
          target_repo_token: ${{ secrets.MY_SYNC_TOKEN }}
          upstream_sync_repo: JustVugg/colibri
          target_sync_branch: main
          upstream_sync_branch: main
